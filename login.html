<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | AWD-COORD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="global-header">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <img src="logo.jpg" alt="AWD-COORD Logo" class="nav-logo">
                AWD-COORD
            </a>
            <div class="nav-auth-buttons">
                <a href="index.html" class="btn btn-outline btn-sm">Home</a>
                <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-bg-shapes">
            <div class="auth-shape-1"></div>
            <div class="auth-shape-2"></div>
        </div>
        <div class="auth-wrapper fade-in-up">
            <div class="auth-brand">
                <img src="logo.jpg" alt="AWD-COORD Logo" class="auth-logo">
            </div>
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to access the live telemetry dashboard.</p>
            </div>
            
            <form id="login-form" class="pro-form">
                <div id="login-error" class="error-msg hidden">Invalid username or password.</div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" required placeholder="e.g. admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-glow">Log In</button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfAuth();
            
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                
                if (login(user, pass)) {
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
